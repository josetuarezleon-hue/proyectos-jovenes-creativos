  <body>
    <header>
    <h1> Nutri matters</h1>
      <nav>
        <a href="#inicio">Inicio</a>
        <a href="#plan">Plan</a>
        <a href="#compras">Compras</a>
        <a href="#progreso">Progreso</a>

    <main>
      <!-- Secion de Inicio -->
      <section id="inicio">
        <h2>Control de gastos alimenticios</h2>
        <p>Controla tu presupuesto nutricional de forma sencilla</p>
      </section>
      <!-- Formulario para agregar gastos -->
      <section id= "gastos">
        <h2>Registras Nuevo Gasto</h2>
        <form id= "form-gastos">
          <label for="concepto">Producto / Alimento</label>
          <input type="text" id="concepto" placeholder="Ej. Frutas y verduras" required>

          <label for="monto">Monto ($):</label>
          <input type="numbre" id="monto" step="0.01" placeholder="Ej. 15.30" required>
          
    </main>
  </body>

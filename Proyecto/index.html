<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Nutri matters</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <script src="calculos.js"></script>
  </head>
  <body>
    <header>
    <h1> Nutri matters</h1>
      <nav>
        <a href="#inicio">Inicio</a>
        <a href="#plan">Plan</a>
        <a href="#compras">Compras</a>
        <a href="#progreso">Progreso</a>
        <a href="#perfil">Perfil</a>
      </nav>
    </header>
    <main>
      <!-- Secion de Inicio -->
      <section id="inicio">
        <h2>Control de gastos alimenticios</h2>
        <p>Controla tu presupuesto nutricional de forma sencilla</p>
      </section>
      <!-- Formulario para agregar gastos -->
      <section id= "gastos">
        <h2>Registras Nuevo Gasto</h2>
        <form id= "form-gastos">
          <label for="concepto">Producto / Alimento</label>
          <input type="text" id="concepto" placeholder="Ej. Frutas y verduras" required>

          <label for="monto">Monto ($):</label>
          <input type="numbre" id="monto" step="0.01" placeholder="Ej. 15.30" required>
         
          <label for="categorias">Categoria:</label>
          <selec id="categorias">
            <option value="Supermercado">Supermercado</option>
            <option value="Suplementos">Suplementos</option>
            <option value="restaurantes">Restaurantes</option>
            <option value="gym">Gym</option>
          </selec>
          <button type="button" onclick="agregarGastos"()"> Guardar Gastos </button>
        </form>
      </section>
      <!-- Lista de cimpras y tabla de gastos-->
      <section id="compras">
      <h2>Historial de compras</h2>
        <table border="1">
        <thead>
          <tr>
            <th>Productos</th>
            <th>Categorias</th>
            <th>Monto</th>
          </tr>
        </thead>
          <tbody id="lista-gastos"></tbody>
        </table>
      </section>
      
            
          </table>
          </tr>
        </thead>
      </section>
      <!-- Seccion de Resumen Financiero -->
      
    </main>
  </body>
  
</html>
